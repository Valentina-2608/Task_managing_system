<!DOCTYPE HTML>
<html>
<head>
	<title>Task managing system</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="main">
    <div class="caption">Task managing system</div>
    <div class="block_new_task">
        <button id="add_task">Add new task</button>
    </div>
    <div class="tasks_board">
        <div class="board_block">
            <div class="caption_1">to do</div>
        </div>
        <div class="board_block">
            <div class="caption_2">in progress</div>
        </div>
        <div class="board_block">
            <div class="caption_3">done</div>
        </div>
    </div>
    <div class="new_task"></div>
</div>
<script src="script.js"></script>
</body>
</html>
