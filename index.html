<!DOCTYPE HTML>
<html>
<head>
	<title>Task managing system</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="main">
    <div class="caption">Task managing system</div>
    <div class="block_new_task">
        <button id="add_task">Add new task</button>
    </div>
    <div class="tasks_board">
        <div class="board_block1">
            <div class="caption_1">to do</div>
        </div>
        <div class="board_block2">
            <div class="caption_2">in progress</div>
        </div>
        <div class="board_block3">
            <div class="caption_3">done</div>
        </div>
    </div>
    <div class="new_task">
        <div class="caption_4">Add new task</div>
        <div id="form_task">
            <div class="elem">
                <label for="task_title">Title</label><br>
                <input type="text" id="task_title">
            </div>
            <div class="elem">
                <label for="task_description">Description</label><br>
                <textarea id="task_description" rows="5"></textarea>
            </div>
            <div class="elem_date">
                <div class="date_1">
                    <label for="task_title">Start date</label><br>
                    <input type="date" id="start_date">
                </div>
                <div class="date_2">
                    <label for="task_title">End date</label><br>
                    <input type="date" id="end_date">
                </div>
            </div>
            <div class="btn_elem">
                <button id="btn_add">Add task</button>
                <button id="btn_close">Close</button>
            </div>

        </div>
        
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
